---
# Self-signed root used for the Klio server's own TLS material. Klio uses
# mutual TLS between the operator/server and the PostgreSQL clusters it
# protects, so a CA is needed in addition to the server certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: klio-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-${REGION}-tls
spec:
  secretName: klio-${REGION}-tls
  commonName: klio-${REGION}
  dnsNames:
    - klio-${REGION}
    - klio-${REGION}.default
    - klio-${REGION}.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: klio-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-${REGION}-ca
spec:
  commonName: klio-${REGION}
  secretName: klio-${REGION}-ca

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: true
  usages:
    - cert sign

  issuerRef:
    name: klio-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
# CA issuer used to sign the client certificate that each protected Cluster
# authenticates with (see klio/pluginconfiguration.yaml).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: klio-${REGION}-ca
spec:
  ca:
    secretName: klio-${REGION}-ca
---
# Demo-only age keypair used by Klio to encrypt tier1/tier2 data at rest.
# Not a secret worth protecting: it is a well-known key published in Klio's
# own upstream samples, meant for learning/testing purposes only.
