---
# Self-signed root for the region's Klio CA below. Klio uses mutual TLS:
# klio-${REGION}-ca signs the server certificate and every client
# certificate, and each side verifies the other against it.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: klio-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-${REGION}-tls
spec:
  secretName: klio-${REGION}-tls
  commonName: klio-${REGION}
  dnsNames:
    - klio-${REGION}
    - klio-${REGION}.default
    - klio-${REGION}.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: klio-${REGION}-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-${REGION}-ca
spec:
  commonName: klio-${REGION}
  secretName: klio-${REGION}-ca

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: true
  usages:
    - cert sign

  issuerRef:
    name: klio-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
# CA issuer that signs the server certificate above and each Cluster's
# client certificate (see klio/pluginconfiguration.yaml).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: klio-${REGION}-ca
spec:
  ca:
    secretName: klio-${REGION}-ca
---
# Demo-only age keypair used by Klio to encrypt tier1/tier2 data at rest.
# Not a secret worth protecting: it is a well-known key published in Klio's
# own upstream samples, meant for learning/testing purposes only.
apiVersion: v1
kind: Secret
metadata:
  name: klio-${REGION}-encryption
