---
# The Klio Server: one per region, providing tier1 (local, fast) and tier2
# (S3-compatible, durable) storage. Tier 2 reuses the region's RustFS
# instance and credentials, provisioned by scripts/setup.sh regardless of
# which backup plugin is in use (see the "objectstore-${REGION}" secret).
apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: klio-${REGION}
spec:
  image: ghcr.io/cloudnative-pg/klio:${KLIO_VERSION}

  tier1:
    cache:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
          - ReadWriteOnce
    data:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
          - ReadWriteOnce
    encryptionKeyFile:
      fileReference:
        volume:
          secret:
            secretName: klio-${REGION}-encryption
        path: encryption-key
    identityFile:
      fileReference:
        volume:
          secret:
            secretName: klio-${REGION}-encryption
        path: secret-key

  tier2:
    cache:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
          - ReadWriteOnce
    encryptionKeyFile:
      fileReference:
        volume:
          secret:
            secretName: klio-${REGION}-encryption
        path: encryption-key
    identityFile:
      fileReference:
        volume:
          secret:
            secretName: klio-${REGION}-encryption
        path: secret-key
    s3:
      prefix: klio
      bucketName: klio
      endpoint: http://objectstore-${REGION}:9000
      region: us-east-1
      accessKeyId:
        name: objectstore-${REGION}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: objectstore-${REGION}
        key: ACCESS_SECRET_KEY

  queue:
    pvcTemplate:
      resources:
        requests:
          storage: 100Mi
      accessModes:
        - ReadWriteOnce

  tlsSecretName: klio-${REGION}-tls
  caSecretName: klio-${REGION}-ca
