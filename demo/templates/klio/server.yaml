---
# The Klio Server: one per region, providing tier1 (local, fast) and tier2
# (S3-compatible, durable) storage. Tier 2 reuses the region's RustFS
# instance and credentials, provisioned by scripts/setup.sh regardless of
# which backup plugin is in use (see the "objectstore-${REGION}" secret).
apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: klio-${REGION}
spec:
  image: ghcr.io/cloudnative-pg/klio:${KLIO_VERSION}

  # Land the server on an infra-role node, same as the Prometheus/Grafana
  # Operators in monitoring/setup.sh. The Server CRD has no top-level
  # nodeSelector/tolerations of its own; scheduling directives go under
  # spec.template.spec, which is merged with the default server container
  # (containers: [] is mandatory even when empty).
  template:
    spec:
      containers: []
      nodeSelector:
        node-role.kubernetes.io/infra: ""
      tolerations:
        - key: node-role.kubernetes.io/infra
          operator: Exists
          effect: NoSchedule

  # Mounted at /klio: tier1 data, the work queue and both tier caches.
  storage:
    pvcTemplate:
      resources:
        requests:
          storage: 3Gi
      accessModes:
        - ReadWriteOnce

  tier1:
    encryption:
      volume:
        secret:
          secretName: klio-${REGION}-encryption
      keyPath: encryption-key
      identityPath: secret-key

  tier2:
    encryption:
      volume:
        secret:
          secretName: klio-${REGION}-encryption
      keyPath: encryption-key
      identityPath: secret-key
    s3:
      prefix: klio
      bucketName: klio
      endpoint: http://objectstore-${REGION}:9000
      region: us-east-1
      accessKeyId:
        name: objectstore-${REGION}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: objectstore-${REGION}
        key: ACCESS_SECRET_KEY

  # Mount only ca.crt from the CA Secret, keeping the CA key off the pod.
  tls:
    serverIdentity:
      volume:
        secret:
          secretName: klio-${REGION}-tls
      certPath: tls.crt
      keyPath: tls.key
    clientCa:
      volume:
        secret:
          secretName: klio-${REGION}-ca
          items:
            - key: ca.crt
              path: ca.crt
      path: ca.crt
